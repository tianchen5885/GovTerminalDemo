name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "GovTerminalDemo_RealHardware.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unzip Android project
        run: |
          rm -rf build_src
          mkdir -p build_src
          unzip -q GovTerminalDemo_RealHardware.zip -d build_src
          echo "=== ZIP contents ==="
          find build_src -maxdepth 3 -type f | head -100

      - name: Find project root
        id: project
        shell: bash
        run: |
          GRADLEW_PATH="$(find build_src -type f -name gradlew | head -n 1)"

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew not found in ZIP"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project root: $PROJECT_DIR"

      - name: Make gradlew executable
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find "${{ steps.project.outputs.project_dir }}" -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK: $APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GovTerminalDemo-debug-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
